# Build the site and publish it to GitHub Pages.
#
# Nothing in dist/ is committed. It is derived in full from data/, catalog/
# and corpus/, all of which are, so the deployed site is reproducible from any
# commit in this repository by running the three build steps below.
#
# It runs after the scrapers rather than on a schedule of its own: a rebuild
# is only interesting once the data underneath it has moved.

name: publish

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "ingest/**"
      - "data/**"
      - "catalog/**"
      - "corpus/**"
      - "events.json"
      - ".github/workflows/publish.yml"
  workflow_run:
    workflows: ["scrape-daily", "scrape-weekly", "ocr-scans"]
    types: [completed]
  workflow_dispatch:

# Pages needs to write the deployment and read the repo. Nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# One live deployment at a time, and never cancel one halfway: a cancelled
# Pages deploy can leave the site serving a half-uploaded tree.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # A scrape that failed has nothing new to publish.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build the exports (Parquet, SQLite, static API, bulk zips)
        run: python ingest/build_exports.py

      # Reads corpus/pages/, which is committed. The mirrored PDFs are not
      # needed here -- only the text that came out of them.
      - name: Build the document search index
        run: python ingest/build_search.py

      - name: Publish the page text, so a search hit can quote what it found
        run: python ingest/build_pages.py

      - name: Assemble the site root
        run: python ingest/build_site.py

      - name: Check the build produced something worth deploying
        run: |
          python - <<'PY'
          import json, pathlib, sys
          dist = pathlib.Path("dist")
          status = json.loads((dist / "status.json").read_text())
          print(status)
          problems = []
          if status["series"] < 1000:
              problems.append(f"only {status['series']} series")
          if status["observations"] < 300_000:
              problems.append(f"only {status['observations']} observations")
          # index.html loads every one of these, so a copy that silently failed
          # would leave the site half-wired rather than obviously broken.
          for required in ("index.html", "styles.css", "core.js", "app.js",
                           "palette.js", "views-data.js", "views-docs.js",
                           "views-mpc.js", "views-meta.js", "views-desk.js",
                           "views-mydesk.js",
                           "api/v1/series.json", "api/v1/sparks.json",
                           "search/documents.json", "search/meta.json"):
              if not (dist / required).exists():
                  problems.append(f"missing {required}")
          pages = len(list((dist / "pages").glob("*.json.gz"))) if (dist / "pages").exists() else 0
          if pages < 1000:
              problems.append(f"only {pages} documents of page text")
          if problems:
              sys.exit("refusing to deploy: " + "; ".join(problems))
          PY

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
