# The daily ingest.
#
# Every run commits the raw responses under data/raw/. That commit history is
# the point: CBE silently overwrites revised figures, so git is the only record
# that a number ever read differently. It cannot be backfilled, which is why
# this workflow is switched on before any of the parsing or the site exists.

name: scrape-daily

on:
  workflow_dispatch:
  schedule:
    # 08:20 UTC = 10:20 Cairo (EET, UTC+2). CBE posts the official rates in the
    # morning; this leaves a comfortable margin without hammering them at 09:00.
    - cron: "20 8 * * *"

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # A queued run would otherwise check out the commit it was triggered at,
        # which a run ahead of it in the "scrape" group may already have moved
        # past; its commit then collides with the newer data and nothing is saved
        # (seen 11 October 2026). Take main as it stands when this run starts.
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      # Exact versions and hashes: this job holds a token that can push to main.
      - run: pip install --require-hashes -r requirements.lock

      # Every step up to the commit may fail without costing the day: each is
      # allowed to fail, the commit runs regardless and saves whatever was
      # fetched, and the last step turns the run red if any of them failed.
      # Order matters: derive reads the auction records fetch_series wrote,
      # summarise reads everything, and detect_events reads the FX series.
      - name: Fetch all datasets
        id: fetch
        continue-on-error: true
        run: python ingest/fetch_series.py --delay 1.5

      - name: Derive auction series (yield curve, bid-to-cover)
        id: derive
        continue-on-error: true
        run: python ingest/derive_series.py

      # Refuses to write if the chained index stops reproducing CBE's own
      # year-on-year rate, which is the only way to notice that the source
      # changed units under it.
      - name: Chain the consumer price index
        id: prices
        continue-on-error: true
        run: python ingest/derive_prices.py

      # --refresh reads the newest releases again even when cached, so a
      # release CBE corrects after publishing it is not missed for good.
      - name: Extract press-release series (reserves, remittances, MPC)
        id: press
        continue-on-error: true
        run: python ingest/fetch_press.py --skip-cached --refresh 5 --delay 1.5

      # Reads only what fetch_press just wrote plus the already-extracted page
      # text, with no network of its own, so there is no reason for the site's
      # rate-decision history to wait for Sunday. Left in the weekly run too,
      # where it gets to see newly extracted PDF statements.
      - name: MPC statement archive and diffs
        id: mpc
        continue-on-error: true
        run: python ingest/mpc_archive.py

      - name: Rebuild event annotations
        id: events
        continue-on-error: true
        run: python ingest/detect_events.py

      # Two requests to CBE's schedule endpoint. It does not fail when CBE
      # cannot be read: it warns and the dates already in the file stay.
      - name: Read the MPC meeting schedule from CBE
        id: calendar
        continue-on-error: true
        run: python ingest/fetch_mpc_calendar.py

      # A table that lost rows or series against yesterday's commit gets
      # yesterday's copy back, so a short CBE response is flagged and never
      # saved over the record. Everything else is still committed.
      - name: Keep any table that shrank as it was
        id: shrink
        continue-on-error: true
        run: python ingest/summarise.py --shrink --restore

      - name: Summarise and check
        id: check
        continue-on-error: true
        run: python ingest/summarise.py --check

      - name: Commit any changes
        if: always()
        run: |
          git config user.name  "egypt-macro-bot"
          git config user.email "actions@github.com"
          git add data catalog corpus events.json
          if git diff --staged --quiet; then
            echo "No change in CBE data today."
            exit 0
          fi
          # Name what moved, so `git log` reads as a revision history rather
          # than a wall of identical messages. catalog/last_run.json changes on
          # every run by design -- it is the heartbeat proving the scrape ran --
          # so a commit touching only that is labelled as a no-change check.
          CHANGED=$(git diff --staged --name-only -- data/clean/series data/clean/records \
                    | xargs -r -n1 basename | sed 's/\.csv$//' | paste -sd, - | cut -c1-140)
          OTHER=$(git diff --staged --name-only | grep -v '^catalog/last_run\.json$' | head -1)
          if [ -z "$OTHER" ]; then
            git commit -m "check: $(date -u +%Y-%m-%d), no change in CBE data"
          else
            git commit -m "data: $(date -u +%Y-%m-%d) update (${CHANGED:-documents and metadata})"
          fi
          # A long job can finish behind commits that landed while it ran, and a
          # rejected push throws the whole run's work away. Rebase and retry.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected; rebasing onto origin/main (attempt $attempt)"
            git pull --rebase --autostash origin main || exit 1
          done
          echo "::error::could not push after three attempts"
          exit 1

      # After the commit, and warning only. A calendar running out is a
      # reminder, never a reason to lose a day of data or turn the run red.
      - name: Check the MPC calendar
        if: always()
        run: python ingest/summarise.py --calendar

      - name: Mark the run red if any step failed
        if: >-
          always() && (steps.fetch.outcome == 'failure' || steps.derive.outcome == 'failure'
          || steps.prices.outcome == 'failure' || steps.press.outcome == 'failure'
          || steps.mpc.outcome == 'failure' || steps.events.outcome == 'failure'
          || steps.calendar.outcome == 'failure' || steps.shrink.outcome == 'failure'
          || steps.check.outcome == 'failure')
        env:
          OUTCOMES: >-
            fetch=${{ steps.fetch.outcome }} derive=${{ steps.derive.outcome }}
            prices=${{ steps.prices.outcome }} press=${{ steps.press.outcome }}
            mpc=${{ steps.mpc.outcome }} events=${{ steps.events.outcome }}
            calendar=${{ steps.calendar.outcome }} shrink=${{ steps.shrink.outcome }}
            check=${{ steps.check.outcome }}
        run: |
          echo "::error::Saved what was fetched, but a step failed ($OUTCOMES). Check whether CBE changed an endpoint or started blocking us."
          exit 1
